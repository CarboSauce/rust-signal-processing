[package]
name = "rust-signal-processing"
version = "0.1.0"
edition = "2024"

[dependencies]
image = {version = "0.25.10", features = ["default-formats"]}
rfd = "0.17.2"
slint = "1.18.1"
plotters = { version = "0.3.7", default-features = false, features = ["bitmap_backend", "bitmap_encoder", "line_series", "area_series", "histogram", "ttf"] }

[build-dependencies]
slint-build = "1.18.1"

[profile.dev.package."*"]
opt-level = 3
strip = true
